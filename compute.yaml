# Fish runs on gcp-e2-mcp: corpus, Qdrant, keyword index, MCP and IMAP sync.
# PRISM is SHELVED (Ken, 2026-11-12; docs/prism.md): no RunPod workloads. Its
# whole RunPod bill ($348, Jun-Sep 2026) was an L4 left up 24 h/day; the
# adapters train in minutes on CPU. To revive it, train on CPU here or add
#   workloads: { train: runpod-24g, label: gcp-e2-mcp, freeze: gcp-e2-mcp }
# (runpod-24g: cheapest 24 GB Community card, capped $/h; see compute/AGENTS.md).
resource: gcp-e2-mcp
repo: ~/ws/fish
sync_paths:
  - models/
