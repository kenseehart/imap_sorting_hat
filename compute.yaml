# Default resource for sync / compute run when using ``.`` from this repo.
# Use-case routing (workloads) is separate from hardware inventory names.
resource: runpod-l4
repo: ~/ws/fish
sync_paths:
  - models/

workloads:
  train: runpod-l4
  label: runpod-cpu32
  freeze: runpod-cpu32

# Canonical fish.db lives on gcp-e2-mcp (GCP VM mcp-services) at /data/fish/fish.db.
# Heavy label/freeze/train: RunPod workers — not the MCP host.
#   compute up runpod-cpu32   # or runpod-l4 for --gpu train
#   compute sync gcp-e2-mcp pull fish.db
#   compute sync runpod-l4 push models/   # after train
#   compute down runpod-l4
